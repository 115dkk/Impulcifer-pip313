<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1810" viewBox="0 0 1800 1810" role="img" aria-labelledby="title desc">
<title id="title">Impulcifer 3 — Audio DSP Architecture</title>
<desc id="desc">Actual audio application architecture at master 57bc151, version 3.0.0-alpha.0. Existing desktop web UI connects through a pywebview compatibility bridge and Tauri to shared Rust services. Native CLI calls shared BRIR execution directly. Python calls shared services through PyO3. Rust owns jobs, f64 DSP, WASAPI or CPAL audio, WAV and FFmpeg I/O, analysis and Plotters PNG rendering. Packaging and Python 2.x golden tests are separate from the processing path.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40566e"/></marker>
  <marker id="softArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c8999"/></marker>
  <style>
  text { font-family: 'Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; fill:#1b2b3b; }
  .title {font-size:52px;font-weight:800;letter-spacing:-1px}
  .sub {font-size:26px;fill:#526274}
  .h {font-size:29px;font-weight:750}
  .body {font-size:24px}
  .small {font-size:21px;fill:#526274}
  .code {font-family:'DejaVu Sans Mono','Cascadia Code',monospace;font-size:22px}
  .node {fill:white;stroke:#bac6d1;stroke-width:2}
  .group {fill:#edf3f7;stroke:#aebdcb;stroke-width:2}
  .rust {fill:#fff8f0;stroke:#cc9865;stroke-width:2}
  .io {fill:#f0faf7;stroke:#78a99c;stroke-width:2}
  .wire {fill:none;stroke:#40566e;stroke-width:3;marker-end:url(#arrow);stroke-linejoin:round}
  .ref {fill:none;stroke:#7c8999;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#softArrow)}
  </style>
</defs>
