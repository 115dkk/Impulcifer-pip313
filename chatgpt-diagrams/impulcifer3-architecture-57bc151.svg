<rect x="600" y="280" width="250" height="103" rx="9" class="node"/>
<text x="725" y="319" text-anchor="middle" class="body" font-weight="700">Tauri 2 셸</text>
<text x="725" y="351" text-anchor="middle" class="small">창 · 대화상자 · 테마</text>

