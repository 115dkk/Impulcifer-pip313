<text x="60" y="126" class="sub">오디오 측정·BRIR 처리 · 실제 코드 기준 실행 흐름</text>
<text x="1740" y="67" text-anchor="end" class="code">3.0.0-alpha.0</text>
<text x="1740" y="103" text-anchor="end" class="code">master @ 57bc151</text>
<text x="1740" y="139" text-anchor="end" class="small">2026-09-09 · 115dkk/Impulcifer-pip313</text>

