<text x="198" y="319" text-anchor="middle" class="body" font-weight="700">기존 Web UI</text>
<text x="198" y="351" text-anchor="middle" class="small">HTML / CSS / JS</text>
<path d="M310 330 H335" class="wire"/>
<rect x="337" y="280" width="237" height="103" rx="9" class="node"/>
<text x="455" y="319" text-anchor="middle" class="code">bridge.js</text>
<text x="455" y="351" text-anchor="middle" class="small">pywebview 호환 Proxy</text>
