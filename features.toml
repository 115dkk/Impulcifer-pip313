# Feature registry. Every user-visible or contract-level capability of Impulcifer 3.x
# must be listed here. The gate test in crates/impulcifer-policy fails when:
#   * a canonical IPC method / config field / pipeline stage is missing from this file,
#   * a feature marked status = "implemented" has no tests, or a listed test function
#     ("crate-name::test_fn") does not exist in that crate's sources.
# Marking a feature implemented without a verification test is a CI failure by design.

[[feature]]
id = "policy.unsafe_forbid_everywhere"
kind = "policy"
status = "implemented"
tests = ["impulcifer-policy::every_crate_root_forbids_unsafe", "impulcifer-policy::no_unsafe_outside_budget"]

[[feature]]
id = "policy.feature_registry"
kind = "policy"
status = "implemented"
tests = ["impulcifer-policy::canonical_features_registered", "impulcifer-policy::implemented_features_have_existing_tests"]

