name: Rust

# 3.x Rust workspace gates (ADR 0002, ADR 0003). Runs only when 3.x files change
# (the app UI lives in apps/impulcifer-app/ui since ADR 0003).
# The policy tests in crates/impulcifer-policy enforce #![forbid(unsafe_code)]
# on every crate root, the unsafe budget, and the features.toml registry.

on:
  push:
    branches: [ master ]   # PR branches run through pull_request only (no double runs)
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "features.toml"
      - "unsafe-budget.toml"
      - "crates/**"
      - "apps/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [ master ]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "features.toml"
      - "unsafe-budget.toml"
      - "crates/**"
      - "apps/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: fmt + clippy + gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri and audio system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev patchelf

      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-lint-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-lint-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- --no-deps -D warnings

      - name: Policy gates (forbid unsafe, unsafe budget, feature registry)
        run: cargo test -p impulcifer-policy -- --nocapture

  js:
    name: JS type check + contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/impulcifer-app/package-lock.json

      - name: Install the pinned TypeScript
        working-directory: apps/impulcifer-app
        run: npm ci --no-audit --no-fund

      - name: tsc --checkJs (apps/impulcifer-app/tsconfig.json)
        working-directory: apps/impulcifer-app
        run: npm run typecheck

      - name: Bridge, observer and driver contracts
        working-directory: apps/impulcifer-app
        run: npm run test:contracts

  test:
    name: cargo test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The Linux leg runs on the ubuntu-latest (26.04) host inside the plain
    # ubuntu:26.04 image. The runner image installs libc6 as the amd64v3
    # variant, built for x86-64-v3 with FMA compiled in, and its libm rounds
    # hypot, log10, log and pow differently from the generic build in a few
    # cases (GLIBC_TUNABLES cannot switch it back). The s2r fixtures come from
    # the generic glibc (Debian 2.41, bit-identical to generic 2.43), and their
    # Exact gates must stay bit-exact on this leg; on the bare runner
    # room_tuning2_s2r_pair_phase was 1-8 ulp off. See
    # tests/migration/README-secs2r.md.
    container: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu:26.04' || '' }}
    steps:
      # The container starts bare: git must exist before checkout so the
      # workspace is a real clone, and the Tauri/ALSA headers, a C toolchain,
      # pkg-config and Node.js (apps/impulcifer-app/tests/smoke.rs) follow.
      - name: Install build tools, Tauri and audio system libraries (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config nodejs \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev patchelf
          dpkg -s libc6 | grep -E '^(Version|Architecture)'

      - uses: actions/checkout@v5

      - name: Install rustup (Linux container)
        if: runner.os == 'Linux'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The container leg keeps its own cache: target/ fingerprints hold the
          # workspace path, which differs between the host and the container.
          key: rust-test-${{ runner.os }}${{ matrix.os == 'ubuntu-latest' && '-container2604' || '' }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-test-${{ runner.os }}${{ matrix.os == 'ubuntu-latest' && '-container2604' || '' }}-

      # Container steps run as root, and root writes through read-only file
      # permissions, so brir_outputs' output_readonly_file_failure_preserves_
      # existing_bytes cannot fail the write it depends on. Hand the workspace
      # and the toolchain to an ordinary user (uid 1001, the host runner's) and
      # run cargo as that user. The cache steps stay root and still read it all.
      - name: cargo test --workspace and --doc as an unprivileged user (Linux container)
        if: runner.os == 'Linux'
        run: |
          useradd --create-home --uid 1001 tester
          chown -R tester: "$GITHUB_WORKSPACE" "$HOME"
          as_tester() { runuser -u tester -- env HOME="$HOME" PATH="$PATH" "$@"; }
          as_tester cargo test --workspace --all-targets
          as_tester cargo test --workspace --doc

      - name: cargo test --workspace
        if: runner.os != 'Linux'
        run: cargo test --workspace --all-targets

      - name: cargo test --doc
        if: runner.os != 'Linux'
        run: cargo test --workspace --doc

  wheel:
    name: python wheel (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # The wheel carries no audio backend (crates/impulcifer-python builds the
      # service and CLI without native-audio), so no ALSA headers are needed and
      # the Linux wheel is a real manylinux wheel built inside the manylinux_2_28
      # container below.
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-wheel-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-wheel-${{ runner.os }}-

      - name: Install maturin and pytest
        run: python -m pip install "maturin>=1.7,<2" pytest

      - name: Stage package data and catalogs (sync_data.py)
        run: python crates/impulcifer-python/sync_data.py

      - name: Build the abi3 wheel (manylinux_2_28 container)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          manylinux: 2_28
          # The action's `manylinux` input already passes the platform tag; a second
          # --compatibility makes maturin fail with "Expected only one platform tag".
          args: --release --features python -m crates/impulcifer-python/Cargo.toml --auditwheel check

      - name: Build the abi3 wheel
        if: runner.os != 'Linux'
        run: python -m maturin build --release --features python -m crates/impulcifer-python/Cargo.toml

      - name: The Linux wheel must carry the manylinux_2_28 tag
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ls -la target/wheels
          ls target/wheels/impulcifer_py313-*-manylinux_2_28_x86_64.whl

      - name: Rewrite RECORD as CSV (maturin leaves the comma in sweep-seg-FL,FR unquoted)
        run: python crates/impulcifer-python/repair_record.py

      - name: Test the installed wheel (crates/impulcifer-python/tests)
        run: python -m pytest crates/impulcifer-python/tests -q

  sdist:
    name: python sdist builds with pip
    needs: lint
    runs-on: ubuntu-latest
    # Where no wheel exists (Intel macOS, Linux aarch64, musl, ...) pip builds
    # the sdist through build_backend.py. Build it the same way here and run the
    # wheel tests against the result, so a file the sdist lacks fails the PR.
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-sdist
    steps:
      - uses: actions/checkout@v5

      # The sdist carries no rust-toolchain.toml (users build with their own
      # toolchain; rust-version in Cargo.toml names the minimum), so pin the
      # workspace toolchain for the build outside the checkout.
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup show
          echo "RUSTUP_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-sdist
          key: rust-sdist-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-sdist-

      - name: Install maturin and pytest
        run: python -m pip install "maturin>=1.7,<2" pytest

      - name: Stage package data and catalogs (sync_data.py)
        run: python crates/impulcifer-python/sync_data.py

      - name: Build the sdist
        run: python -m maturin sdist -m crates/impulcifer-python/Cargo.toml -o "$RUNNER_TEMP/sdist"

      # maturin writes every sdist file with the same old timestamp (2006-07-24),
      # and cargo judges path crates fresh by mtime, so the cached target-sdist
      # would hand the wheel build the workspace crates of an earlier commit
      # (unchanged Cargo.lock keeps the cache key). Drop only those crates;
      # registry dependencies stay cached.
      - name: Drop cached workspace crates from target-sdist
        run: >
          cargo clean --release
          -p impulcifer-types -p impulcifer-io -p impulcifer-analysis -p impulcifer-dsp
          -p impulcifer-plots -p impulcifer-jobs -p impulcifer-audio-io
          -p impulcifer-service -p impulcifer-cli -p impulcifer-python

      - name: Build a wheel from the sdist with pip (PEP 517, build_backend.py)
        run: python -m pip wheel --no-deps -w "$RUNNER_TEMP/from-sdist" "$RUNNER_TEMP"/sdist/*.tar.gz

      - name: Test the wheel built from the sdist (crates/impulcifer-python/tests)
        env:
          IMPULCIFER_WHEEL_DIR: ${{ runner.temp }}/from-sdist
        run: python -m pytest crates/impulcifer-python/tests -q
