name: Rust

# 3.x Rust workspace gates (ADR 0002, ADR 0003). Runs only when 3.x files change
# (the app UI lives in apps/impulcifer-app/ui since ADR 0003).
# The policy tests in crates/impulcifer-policy enforce #![forbid(unsafe_code)]
# on every crate root, the unsafe budget, and the features.toml registry.

on:
  push:
    branches: [ master ]   # PR branches run through pull_request only (no double runs)
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "features.toml"
      - "unsafe-budget.toml"
      - "crates/**"
      - "apps/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [ master ]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "features.toml"
      - "unsafe-budget.toml"
      - "crates/**"
      - "apps/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: fmt + clippy + gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri and audio system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev patchelf

      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-lint-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-lint-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- --no-deps -D warnings

      - name: Policy gates (forbid unsafe, unsafe budget, feature registry)
        run: cargo test -p impulcifer-policy -- --nocapture

  js:
    name: JS type check + contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/impulcifer-app/package-lock.json

      - name: Install the pinned TypeScript
        working-directory: apps/impulcifer-app
        run: npm ci --no-audit --no-fund

      - name: tsc --checkJs (apps/impulcifer-app/tsconfig.json)
        working-directory: apps/impulcifer-app
        run: npm run typecheck

      - name: Bridge, observer and driver contracts
        working-directory: apps/impulcifer-app
        run: npm run test:contracts

  test:
    name: cargo test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri and audio system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev patchelf

      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-test-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-test-${{ runner.os }}-

      - name: cargo test --workspace
        run: cargo test --workspace --all-targets

      - name: cargo test --doc
        run: cargo test --workspace --doc

  wheel:
    name: python wheel (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install audio system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-wheel-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-wheel-${{ runner.os }}-

      - name: Install maturin and pytest
        run: python -m pip install "maturin>=1.7,<2" pytest

      - name: Stage package data (copies of data/ into the wheel)
        run: python crates/impulcifer-python/sync_data.py

      - name: Build the abi3 wheel
        run: python -m maturin build --release --features python -m crates/impulcifer-python/Cargo.toml

      - name: Test the installed wheel (crates/impulcifer-python/tests)
        run: python -m pytest crates/impulcifer-python/tests -q
