name: Rust

# 3.x Rust workspace gates (ADR 0002). Runs only when Rust-side files change.
# The policy tests in crates/impulcifer-policy enforce #![forbid(unsafe_code)]
# on every crate root, the unsafe budget, and the features.toml registry.

on:
  push:
    branches: [ master, claude/* ]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "features.toml"
      - "unsafe-budget.toml"
      - "crates/**"
      - "apps/**"
      - "webview_ui/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [ master ]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "features.toml"
      - "unsafe-budget.toml"
      - "crates/**"
      - "apps/**"
      - "webview_ui/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: fmt + clippy + gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri and audio system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev patchelf

      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-lint-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-lint-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- --no-deps -D warnings

      - name: Policy gates (forbid unsafe, unsafe budget, feature registry)
        run: cargo test -p impulcifer-policy -- --nocapture

  test:
    name: cargo test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri and audio system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev patchelf

      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-test-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-test-${{ runner.os }}-

      - name: cargo test --workspace
        run: cargo test --workspace --all-targets

      - name: cargo test --doc
        run: cargo test --workspace --doc
