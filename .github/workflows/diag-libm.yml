# TEMPORARY: compare libm results between Ubuntu runner images. Remove before merge.
name: diag libm

on:
  push:
    branches: [claude/ci-ubuntu-2604]
  workflow_dispatch:

jobs:
  probe:
    name: libm probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Machine
        run: |
          set -x
          uname -a
          lscpu | sed -n '1,25p'
          grep -o -w -E 'avx512f|avx512dq|fma|avx2|bmi2|f16c|movbe' /proc/cpuinfo | sort | uniq -c
          dpkg -s libc6 | grep -E '^(Version|Architecture)'
          dpkg --print-architecture
          apt-config dump | grep -i -E 'variant|amd64v' || true
          ls -la /usr/lib/x86_64-linux-gnu/glibc-hwcaps 2>/dev/null || true
          /lib64/ld-linux-x86-64.so.2 --help | sed -n '/hwcaps/,$p'
          ls -la /lib/x86_64-linux-gnu/libm.so.6
          sha256sum "$(readlink -f /lib/x86_64-linux-gnu/libm.so.6)"
          dpkg -S "$(readlink -f /lib/x86_64-linux-gnu/libm.so.6)" || true
          env | grep -i -E 'rustflags|cargo' || true
          cat ~/.cargo/config.toml 2>/dev/null || true

      - name: Probe
        run: |
          cat > probe.c <<'EOF'
          #include <stdio.h>
          #include <math.h>
          #include <stdint.h>
          #include <string.h>
          static uint64_t s = 0x9E3779B97F4A7C15ULL;
          static double rnd(void){ s ^= s<<13; s ^= s>>7; s ^= s<<17; return (double)(s>>11) * (1.0/9007199254740992.0); }
          static uint64_t b(double x){ uint64_t u; memcpy(&u,&x,8); return u; }
          int main(void){
            for(int i=0;i<200000;i++){
              double x = (rnd()-0.5)*pow(10, rnd()*8-4), y = (rnd()-0.5)*pow(10, rnd()*8-4), z = rnd()*pow(10, rnd()*6-3);
              printf("%d %016llx %016llx %016llx %016llx %016llx %016llx %016llx %016llx\n", i,
                (unsigned long long)b(hypot(x,y)), (unsigned long long)b(log10(z)), (unsigned long long)b(atan2(y,x)),
                (unsigned long long)b(log(z)), (unsigned long long)b(exp(x/1000)), (unsigned long long)b(sin(x)),
                (unsigned long long)b(cos(x)), (unsigned long long)b(pow(z,0.5)));
            }
            return 0;
          }
          EOF
          gcc -O2 -fno-builtin -o probe probe.c -lm
          ./probe > out.txt
          # Local reference (Debian glibc 2.41 and ubuntu:26.04 container, i5-12600KF):
          # 2 4ec2a1d7c1c48c15 hypot   3 ef21de0fdddfc295 log10   4 692b1bcfd7b27345 atan2
          # 5 fe95baaebbedb72e ln      6 b2f5e3dfef099208 exp     7 d82ecfc954cedb92 sin
          # 8 8e5b94943cff8887 cos     9 66792a48148cf1bf pow
          for k in 2 3 4 5 6 7 8 9; do printf '%s %s\n' "$k" "$(cut -d' ' -f$k out.txt | sha256sum | cut -c1-16)"; done
          for tunable in "" "glibc.cpu.hwcaps=-AVX512F,-AVX512DQ,-AVX512VL" "glibc.cpu.hwcaps=-FMA,-AVX2"; do
            echo "== GLIBC_TUNABLES=$tunable"
            GLIBC_TUNABLES="$tunable" ./probe > t.txt
            for k in 2 3 4 5 6 7 8 9; do printf '%s %s\n' "$k" "$(cut -d' ' -f$k t.txt | sha256sum | cut -c1-16)"; done
          done
