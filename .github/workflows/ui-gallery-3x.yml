# 3.x UI 갤러리 리뷰 파이프라인.
#
# webview-gallery.yml(2.x webview_ui)과 같은 방식으로 3.x 화면
# (apps/impulcifer-app/ui)을 그린다. apps/impulcifer-app/tests/ui_gallery.py가
# mock IPC 위에서 스킨 x 테마 x 언어 x 시나리오 조합을 렌더링하고 동작을
# 검사한 뒤(샷 수 자가검증), PNG를 webview-gallery 브랜치의
# runs-3x/<run>-pr<PR>에 올리고 리뷰 이슈를 연다. 브랜치와 이슈에는 최신
# 갤러리만 남는다(이 실행과 아직 열린 다른 PR의 최신 실행,
# .github/scripts/gallery_publish.py). fork PR은 브랜치 push/이슈 생성 권한이
# 없으므로 제외한다.
name: 3.x UI Gallery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/impulcifer-app/ui/**'
      - 'apps/impulcifer-app/tests/ui_gallery.py'
      - 'crates/impulcifer-service/locales/**'
      - 'i18n/locales/**'
      - '.github/workflows/ui-gallery-3x.yml'
      - '.github/scripts/gallery_publish.py'

permissions:
  contents: write
  issues: write
  # gallery_publish.py lists open PRs to decide which galleries stay.
  pull-requests: read

concurrency:
  group: ui-gallery-3x-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gallery:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Render gallery
        run: python apps/impulcifer-app/tests/ui_gallery.py --out ui-gallery-3x

      - name: Upload gallery artifact
        uses: actions/upload-artifact@v6
        with:
          name: ui-gallery-3x
          path: ui-gallery-3x/*.png

      # Keeps only the latest galleries: the branch is rewritten as one commit
      # holding this run and the newest run of every other open PR, and review
      # issues of closed PRs are closed (.github/scripts/gallery_publish.py).
      - name: Publish the gallery and its review issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/gallery_publish.py --kind 3x --images ui-gallery-3x
