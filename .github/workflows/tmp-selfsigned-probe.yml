# Temporary probe (deleted after one run): does a self-signed code-signing
# certificate give two different builds the same designated requirement, which
# TCC uses to keep a privacy grant such as the microphone (TN3127)? Compared
# with ad hoc signing. Not a test of this repository's code.
name: tmp self-signed signing probe
on:
  push:
    branches: [ccr-083fe5e3-isoctv]
    paths: [.github/workflows/tmp-selfsigned-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Self-signed identity versus ad hoc
        shell: bash
        run: |
          set +e
          sw_vers
          work="$RUNNER_TEMP/probe"; mkdir -p "$work"; cd "$work"
          cat > cert.cnf <<'EOF'
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = Probe Local Signing
          [ext]
          basicConstraints = critical,CA:false
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          EOF
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 3650 -config cert.cnf 2>&1 | tail -1
          /usr/bin/openssl pkcs12 -export -inkey key.pem -in cert.pem -out id.p12 -passout pass:probe
          kc="$work/probe.keychain-db"
          security create-keychain -p kc "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p kc "$kc"
          security import id.p12 -k "$kc" -P probe -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k kc "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "== identities (all, then valid only) before any trust setting"
          security find-identity -p codesigning "$kc"
          security find-identity -v -p codesigning "$kc"

          printf 'int main(void){return 0;}\n' > a.c
          printf 'int main(void){return 1;}\n' > b.c
          cc a.c -o build1 && cc b.c -o build2
          cp build1 adhoc1 && cp build2 adhoc2

          echo "== sign two different builds with the untrusted self-signed identity"
          for f in build1 build2; do
            codesign -f -s "Probe Local Signing" --keychain "$kc" -i dev.example.probe -o runtime "$f" && echo "signed $f" || echo "SIGN FAILED $f"
          done
          for f in adhoc1 adhoc2; do codesign -f -s - -i dev.example.probe -o runtime "$f"; done

          for f in build1 build2 adhoc1 adhoc2; do
            echo "== $f"
            codesign -dvvv "$f" 2>&1 | grep -E '^(CDHash|Signature|Authority|TeamIdentifier|Runtime)'
            codesign -d -r- "$f" 2>&1 | grep 'designated'
            codesign --verify --strict -v "$f" 2>&1 | tail -2
            "./$f"; echo "$f ran, exit status $?"
          done

          dr() { codesign -d -r- "$1" 2>&1 | sed -n 's/^#* *designated => //p'; }
          echo "== does build 2 meet build 1's designated requirement?"
          codesign --verify -R="=$(dr build1)" build2 && echo "self-signed: build2 SATISFIES build1 DR" || echo "self-signed: build2 does NOT satisfy build1 DR"
          codesign --verify -R="=$(dr adhoc1)" adhoc2 && echo "ad hoc: adhoc2 SATISFIES adhoc1 DR" || echo "ad hoc: adhoc2 does NOT satisfy adhoc1 DR"

          echo "== Gatekeeper assessment (informative)"
          spctl -a -t exec -vv build1 2>&1 | tail -2
          spctl -a -t exec -vv adhoc1 2>&1 | tail -2

          echo "== after trusting the certificate for code signing (system keychain, needs admin)"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain cert.pem && echo trusted || echo "trust failed"
          security find-identity -v -p codesigning "$kc"
          security delete-keychain "$kc" || true
