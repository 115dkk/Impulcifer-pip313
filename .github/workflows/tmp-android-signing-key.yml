# Temporary (removed once the key is committed): make the project's Android APK
# signing key (ADR 0020, item 11) and commit it to this branch. The maintainer
# approved this on 2026-11-15 for 115dkk/Impulcifer-pip313, branch
# claude/android-port. The key is created and encrypted inside the job; only
# the encrypted PKCS#12 store and the public certificate leave it. `generate`
# is not captured, so its ::add-mask:: command reaches the runner.
name: tmp Android signing key
on:
  push:
    branches: [claude/android-port]
    paths: [.github/workflows/tmp-android-signing-key.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/android-port
      - name: Generate and commit the key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          dir=apps/impulcifer-app/android-signing
          bash .github/scripts/android_signing_key.sh generate "$dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dir/release.p12" "$dir/certificate.pem"
          git commit -m "build(android): the project's APK signing key (ADR 0020)" \
            -m "release.p12 is encrypted with a password derived from the updater signing secrets; certificate.pem is public."
          git push origin HEAD:claude/android-port
