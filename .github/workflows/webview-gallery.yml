# WebView UI 갤러리 리뷰 파이프라인.
#
# EqualizerAPO-XT의 offscreen skin gallery 패턴을 이식한 것: 헤드리스
# 브라우저가 mock 브리지 위에서 모든 view x theme x language 조합을
# 렌더링하고(스크립트가 정확한 샷 수를 자가검증), PNG를 webview-gallery
# 브랜치의 runs/<run>-pr<PR>에 올린 뒤 리뷰 이슈를 열어 사용자가 화면을
# 직접 보고 판정할 수 있게 한다. 브랜치와 이슈에는 최신 갤러리만 남는다
# (이 실행과 아직 열린 다른 PR의 최신 실행, .github/scripts/gallery_publish.py).
# fork PR은 브랜치 push/이슈 생성 권한이 없으므로 제외.
name: WebView Gallery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'webview_ui/**'
      - 'application/**'
      - 'impulcifer_webview.py'
      - 'build_scripts/webview_gallery.py'
      - '.github/workflows/webview-gallery.yml'
      - '.github/scripts/gallery_publish.py'

permissions:
  contents: write
  issues: write
  # gallery_publish.py lists open PRs to decide which galleries stay.
  pull-requests: read

concurrency:
  group: webview-gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gallery:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Render gallery
        run: python build_scripts/webview_gallery.py --out webview-gallery

      - name: Upload gallery artifact
        uses: actions/upload-artifact@v6
        with:
          name: webview-gallery
          path: webview-gallery/*.png

      # Keeps only the latest galleries: the branch is rewritten as one commit
      # holding this run and the newest run of every other open PR, and review
      # issues of closed PRs are closed (.github/scripts/gallery_publish.py).
      - name: Publish the gallery and its review issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/gallery_publish.py --kind 2x --images webview-gallery
