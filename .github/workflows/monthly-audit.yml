# ──────────────────────────────────────────────────────────────
# Biweekly Architecture & Tech Debt Audit (통합 워크플로)
# ──────────────────────────────────────────────────────────────
#
# 격주로 /improve-codebase-architecture + /tech-debt-audit를
# 단일 claude -p 세션에서 실행합니다.
# 직전 감사 이후 코드 변경이 없으면(문서 등 제외) 실행하지 않습니다.
#
# 모델: claude-mythos-5-1
# Effort: xhigh
#
# 필요 사항:
#   1. `claude setup-token`으로 구독 OAuth 토큰을 생성한 뒤
#      Settings > Secrets에 CLAUDE_CODE_OAUTH_TOKEN 등록
#   2. Settings > Actions > Workflow permissions를
#      "Read and write permissions"로 설정
#   3. 감사 스킬은 저장소에 두지 않습니다. 실행할 때마다
#      115dkk-skills 플러그인(마켓플레이스 115dkk/agent-skills, 공개
#      저장소라 토큰 없이 받음)을 기본 브랜치에서 설치하고, 프롬프트는
#      /115dkk-skills:improve-codebase-architecture와
#      /115dkk-skills:tech-debt-audit를 부릅니다. 플러그인 매니페스트도
#      버전을 고정하지 않으므로 대화형 세션과 같은 판으로 감사하고, 어느
#      커밋으로 돌았는지는 이슈 본문에 남습니다. 두 스킬 모두 혼자 돌고
#      모델이 부를 수 있어, 실행 전에 잠금을 풀 필요가 없습니다.
#   4. RELEASE_DEPLOY_KEY(릴리스 게이트가 이미 쓰는 쓰기 배포 키).
#      TECH_DEBT_AUDIT.md는 감사가 끝날 때마다 master에 커밋되고 다음
#      감사의 기준 결과가 됩니다. tech-debt-audit는 저장소 루트의 이 파일을
#      지난 감사로 읽어 TD-NN 번호를 유지하고 그 뒤에 해결된 항목을 적습니다.
#      commit-baseline 잡이 이 키로 SSH push합니다. master의 'Required
#      checks' 룰셋은 배포 키만 통과시키고 이 커밋에는 자체 검사가 없기
#      때문입니다. 키는 Claude 세션이 셸을 쓰는 audit 잡에는 주지 않습니다.
#
# 주의:
#   ANTHROPIC_API_KEY / ANTHROPIC_AUTH_TOKEN이 있으면 Claude Code는
#   구독 OAuth보다 API 인증을 우선합니다. 이 workflow는 구독 할당을
#   쓰기 위해 Claude 실행 직전에 해당 변수를 제거합니다.
#
# Codex 전환 시:
#   claude 명령을 codex -q로 교체하고,
#   CLAUDE_CODE_OAUTH_TOKEN을 OPENAI_API_KEY로 변경하십시오.
# ──────────────────────────────────────────────────────────────

name: Monthly Audit

on:
  schedule:
    - cron: '0 9 15 * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: '변경 없어도 강제 실행'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  # ── 1단계: 코드 변경 감지 ──────────────────────────────────
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_audit: ${{ steps.detect.outputs.should_audit }}
      last_audit_ref: ${{ steps.detect.outputs.last_audit_ref }}
      changed_files_count: ${{ steps.detect.outputs.changed_files_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect code changes since last audit
        id: detect
        run: |
          if [ "${{ inputs.force_run }}" = "true" ]; then
            echo "Force run requested."
            echo "should_audit=true" >> "$GITHUB_OUTPUT"
            echo "last_audit_ref=HEAD~50" >> "$GITHUB_OUTPUT"
            echo "changed_files_count=forced" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_AUDIT=$(git tag -l 'audit/*' --sort=-creatordate | head -1)

          if [ -z "$LAST_AUDIT" ]; then
            echo "첫 감사입니다."
            echo "should_audit=true" >> "$GITHUB_OUTPUT"
            echo "last_audit_ref=" >> "$GITHUB_OUTPUT"
            echo "changed_files_count=initial" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Last audit: $LAST_AUDIT"
          echo "last_audit_ref=$LAST_AUDIT" >> "$GITHUB_OUTPUT"

          # 문서·설정·노트북 파일을 제외한 코드 변경 감지
          CODE_CHANGES=$(git diff --name-only "$LAST_AUDIT"..HEAD \
            -- '.' \
            ':!*.md' \
            ':!*.txt' \
            ':!*.rst' \
            ':!*.adoc' \
            ':!*.ipynb' \
            ':!docs/**' \
            ':!doc/**' \
            ':!wiki/**' \
            ':!Wiki/**' \
            ':!LICENSE*' \
            ':!CHANGELOG*' \
            ':!CHANGES*' \
            ':!SECURITY.md' \
            ':!AGENTS.md' \
            ':!CLAUDE.md' \
            ':!CONTEXT.md' \
            ':!*.mermaid' \
            ':!.gitignore' \
            ':!.gitattributes' \
            | wc -l | tr -d ' ')

          echo "Code files changed: $CODE_CHANGES"
          echo "changed_files_count=$CODE_CHANGES" >> "$GITHUB_OUTPUT"

          if [ "$CODE_CHANGES" -eq 0 ]; then
            echo "코드 변경 없음. 종료합니다."
            echo "should_audit=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_audit=true" >> "$GITHUB_OUTPUT"
          fi

  # ── 2단계: 통합 감사 실행 ──────────────────────────────────
  audit:
    needs: check-changes
    if: needs.check-changes.outputs.should_audit == 'true'
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install audit skills
        id: skills
        run: |
          set -euo pipefail

          # 두 감사 스킬 모두 115dkk-skills 플러그인에서 그때그때 받습니다
          # (머리말 필요 사항 3).
          claude plugin marketplace add 115dkk/agent-skills
          claude plugin install 115dkk-skills@115dkk
          PLUGIN_PATH=$(claude plugin list --json | jq -er '.[] | select(.id == "115dkk-skills@115dkk" and .enabled) | .installPath')

          # 프롬프트가 두 스킬을 실행하라고 지시하는데, 모델은 Skill 도구로만
          # 그렇게 할 수 있습니다. 플러그인 갱신과 함께
          # disable-model-invocation이 들어오면 그 Part가 스킬 없이 즉흥으로
          # 돌게 되므로 여기서 멈춥니다.
          for skill in improve-codebase-architecture tech-debt-audit; do
            SKILL_MD="$PLUGIN_PATH/skills/$skill/SKILL.md"
            test -f "$SKILL_MD"
            if grep -q "^disable-model-invocation:" "$SKILL_MD"; then
              echo "::error::115dkk-skills:$skill carries disable-model-invocation, so the audit cannot invoke it."
              exit 1
            fi
          done

          PLUGIN_SHA=$(jq -r '.plugins["115dkk-skills@115dkk"][0].gitCommitSha // "unknown"' \
            "$HOME/.claude/plugins/installed_plugins.json" 2>/dev/null || echo unknown)
          echo "plugin_ref=115dkk/agent-skills@${PLUGIN_SHA:0:12}" >> "$GITHUB_OUTPUT"

          echo "Installed audit skills from 115dkk/agent-skills@${PLUGIN_SHA}:"
          find "$PLUGIN_PATH/skills" -maxdepth 2 -name SKILL.md -print

      - name: Verify Claude subscription credentials
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not configured."
            echo "Generate a subscription OAuth token with 'claude setup-token'."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [ -n "${ANTHROPIC_API_KEY:-}" ] || [ -n "${ANTHROPIC_AUTH_TOKEN:-}" ]; then
            echo "::warning::Ignoring ANTHROPIC_* credentials so Claude Code uses CLAUDE_CODE_OAUTH_TOKEN."
          fi

      # 워크플로 자체 산출물은 $RUNNER_TEMP/audit에 쓴다 — 체크아웃 작업
      # 트리에 남으면 감사 세션이 untracked 파일로 오인해 finding으로 잡거나
      # 실수로 커밋될 수 있다(특히 .txt는 release gate의 EXCLUDE에 없음).
      # ARCHITECTURE_AUDIT.md/TECH_DEBT_AUDIT.md는 스킬이 repo 루트에 쓰는
      # 규약이므로 그대로 두고 .gitignore로 커밋만 차단한다.
      - name: Generate change summary
        id: changes
        run: |
          mkdir -p "$RUNNER_TEMP/audit"
          SUMMARY="$RUNNER_TEMP/audit/change-summary.txt"
          LAST_REF="${{ needs.check-changes.outputs.last_audit_ref }}"
          if [ -n "$LAST_REF" ]; then
            echo "## 변경된 파일 목록" > "$SUMMARY"
            echo "" >> "$SUMMARY"
            git diff --stat "$LAST_REF"..HEAD \
              -- '.' ':!*.md' ':!*.txt' ':!*.rst' ':!*.ipynb' ':!docs/**' \
              >> "$SUMMARY" 2>/dev/null || true
          else
            echo "첫 감사 실행입니다." > "$SUMMARY"
          fi

      - name: Run combined audit
        run: |
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          REPORT="$RUNNER_TEMP/audit/combined-audit-report.md"

          # 체크아웃에 있는 TECH_DEBT_AUDIT.md는 commit-baseline 잡이 커밋한
          # 지난 감사입니다(필요 사항 4). 스킬이 이것을 기준 결과로 읽고 덮어
          # 쓰므로 blob을 기억해 둡니다. 새 보고서를 쓰지 않은 세션이 옛
          # 파일로 통과하면 안 됩니다.
          BASELINE_BLOB=$(git hash-object TECH_DEBT_AUDIT.md 2>/dev/null || echo none)

          set +e
          claude \
            --model claude-mythos-5-1 \
            --effort xhigh \
            --permission-mode auto \
            --max-turns 50 \
            -p "
          You will perform two analyses in sequence within this
          single session. Output everything to stdout.

          GLOBAL RULES:
          - Completely ignore all .ipynb (Jupyter notebook) files.
            They are retained legacy artifacts, not active code.
          - Cite file paths for every finding.
          - Do not suggest full rewrites.
          - Do not pad categories with filler findings.

          ── PART 1: Architecture Analysis ──
          Run /115dkk-skills:improve-codebase-architecture.
          This is an existing codebase, so use its review report, not the
          foundation or stack report. The skill carries its own glossary
          (module, interface, depth, seam, adapter, leverage, locality)
          and the deletion test in its LANGUAGE.md. Phrase every
          candidate in those exact terms rather than drifting into
          component, service, API, or boundary.
          Identify specific consolidation and deepening opportunities.
          Because this is CI, write the complete architecture analysis to
          ARCHITECTURE_AUDIT.md in the repository root. Do not leave the
          detailed report only in a temp file or browser-opened HTML file.
          Stop there. The skill's step 3 is a grilling loop that asks the
          user which candidate to pursue, and this session has no user, so
          do not ask and do not let that step's side effects happen: leave
          CONTEXT.md and docs/adr/ untouched.
          When done, print a Markdown horizontal rule (---) as a
          separator, then proceed immediately to Part 2.

          ── PART 2: Tech Debt Audit ──
          Run /115dkk-skills:tech-debt-audit.
          TECH_DEBT_AUDIT.md in the repository root, when present, is
          the previous audit, committed by this workflow: read it as
          the skill's baseline. Write the full new TECH_DEBT_AUDIT.md
          over it with severity, effort estimates, and its 'looks bad
          but is fine' section.
          " > "$REPORT" 2>&1
          CLAUDE_EXIT=$?
          set -e

          if [ "$CLAUDE_EXIT" -eq 0 ] && [ ! -s ARCHITECTURE_AUDIT.md ]; then
            echo "::error::Claude audit completed without ARCHITECTURE_AUDIT.md."
            cat "$REPORT"
            exit 1
          fi

          if [ "$CLAUDE_EXIT" -eq 0 ] && [ ! -s TECH_DEBT_AUDIT.md ]; then
            echo "::error::Claude audit completed without TECH_DEBT_AUDIT.md."
            cat "$REPORT"
            exit 1
          fi

          if [ "$CLAUDE_EXIT" -eq 0 ] && [ "$(git hash-object TECH_DEBT_AUDIT.md)" = "$BASELINE_BLOB" ]; then
            echo "::error::Claude audit left the baseline TECH_DEBT_AUDIT.md unchanged."
            cat "$REPORT"
            exit 1
          fi

          if [ -f ARCHITECTURE_AUDIT.md ]; then
            {
              echo ""
              echo "---"
              echo ""
              echo "# ARCHITECTURE_AUDIT.md"
              echo ""
              cat ARCHITECTURE_AUDIT.md
            } >> "$REPORT"
          fi

          if [ -f TECH_DEBT_AUDIT.md ]; then
            {
              echo ""
              echo "---"
              echo ""
              echo "# TECH_DEBT_AUDIT.md"
              echo ""
              cat TECH_DEBT_AUDIT.md
            } >> "$REPORT"
          fi

          if [ ! -s "$REPORT" ]; then
            echo "Audit produced no output." > "$REPORT"
            cat "$REPORT"
            exit 1
          fi

          if [ "$CLAUDE_EXIT" -ne 0 ]; then
            echo "Claude audit failed with exit code $CLAUDE_EXIT."
            cat "$REPORT"
            exit "$CLAUDE_EXIT"
          fi

      - name: Create GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          COUNT="${{ needs.check-changes.outputs.changed_files_count }}"

          {
            echo "# Biweekly Audit: ${DATE}"
            echo ""
            echo "변경된 코드 파일: **${COUNT}개**"
            echo "모델: claude-mythos-5-1 · Effort: xhigh"
            echo "감사 스킬: 115dkk-skills (${{ steps.skills.outputs.plugin_ref }})"
            echo ""
            echo "이 이슈 본문은 artifact의 \`issue-body.md\`에 해당합니다."
            echo "나머지 감사 산출물은 아래 댓글에 파일별로 전체 게시됩니다."
            echo ""
            echo "이 이슈에서 읽을 수 있는 파일:"
            echo "- \`issue-body.md\` - 이 본문"
            echo "- \`change-summary.txt\` - 댓글"
            echo "- \`ARCHITECTURE_AUDIT.md\` - 댓글"
            echo "- \`combined-audit-report.md\` - 댓글"
            echo "- \`TECH_DEBT_AUDIT.md\` - 댓글"
          } > "$RUNNER_TEMP/audit/issue-body.md"

          post_file_comments() {
            local issue_number="$1"
            local file_path="$2"
            local title="$3"

            if [ ! -s "$file_path" ]; then
              echo "Skipping empty or missing file: $file_path"
              return 0
            fi

            local comment_dir
            comment_dir=$(mktemp -d)
            awk -v prefix="$comment_dir/part-" -v limit=18000 '
              BEGIN {
                part = 0
                size = 0
                file = sprintf("%s%04d", prefix, part)
              }
              {
                line = $0 ORS
                line_size = length(line)
                if (size > 0 && size + line_size > limit) {
                  close(file)
                  part++
                  file = sprintf("%s%04d", prefix, part)
                  size = 0
                }
                printf "%s", line >> file
                size += line_size
              }
            ' "$file_path"

            local total
            total=$(find "$comment_dir" -type f -name 'part-*' | wc -l | tr -d ' ')
            local index=1

            local display_name
            display_name=$(basename "$file_path")

            for part in "$comment_dir"/part-*; do
              {
                echo "## ${title} (${index}/${total})"
                echo ""
                echo "Source file: \`${display_name}\`"
                echo ""
                echo '````markdown'
                cat "$part"
                echo ""
                echo '````'
              } > "$comment_dir/comment.md"

              gh issue comment "$issue_number" \
                --repo "${GITHUB_REPOSITORY}" \
                --body-file "$comment_dir/comment.md"

              index=$((index + 1))
            done
          }

          gh label create audit \
            --repo "${GITHUB_REPOSITORY}" \
            --color "5319e7" \
            --description "Architecture and tech debt audit" \
            >/dev/null 2>&1 || true

          gh label create maintenance \
            --repo "${GITHUB_REPOSITORY}" \
            --color "fbca04" \
            --description "Maintenance work" \
            >/dev/null 2>&1 || true

          ISSUE_URL=$(gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Biweekly Audit: ${DATE}" \
            --body-file "$RUNNER_TEMP/audit/issue-body.md" \
            --label audit \
            --label maintenance)

          echo "Created issue: ${ISSUE_URL}"
          ISSUE_NUMBER="${ISSUE_URL##*/}"

          post_file_comments "$ISSUE_NUMBER" "$RUNNER_TEMP/audit/change-summary.txt" "Change summary"
          post_file_comments "$ISSUE_NUMBER" ARCHITECTURE_AUDIT.md "Architecture audit"
          post_file_comments "$ISSUE_NUMBER" "$RUNNER_TEMP/audit/combined-audit-report.md" "Combined audit report"
          post_file_comments "$ISSUE_NUMBER" TECH_DEBT_AUDIT.md "Tech debt audit"

      - name: Collect report artifacts
        run: |
          cp ARCHITECTURE_AUDIT.md TECH_DEBT_AUDIT.md "$RUNNER_TEMP/audit/" 2>/dev/null || true

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: "audit-report-${{ github.run_id }}"
          path: ${{ runner.temp }}/audit/
          retention-days: 90

      - name: Tag audit checkpoint
        run: |
          AUDIT_TAG="audit/$(date +%Y%m%d-%H%M%S)"
          git tag "$AUDIT_TAG"
          git push origin "$AUDIT_TAG"
          echo "Tagged: $AUDIT_TAG"

  # ── 3단계: 다음 감사의 기준 결과 커밋 ─────────────────────
  commit-baseline:
    # 이번 실행의 TECH_DEBT_AUDIT.md를 다음 감사의 기준 결과로 master에
    # 커밋합니다(머리말 필요 사항 4). audit 잡이 산출물 검사, 이슈 등록,
    # 체크포인트 태그까지 마친 뒤에만 돕니다.
    needs: audit
    # 기능 브랜치에서 수동 실행한 감사는 master의 기준 결과가 아닙니다. 그
    # 브랜치를 체크아웃해 rebase하면 머지되지 않은 커밋까지 배포 키로 master에
    # 올라가므로, master에서 돈 실행만 커밋하고 체크아웃도 master로 고정합니다.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # push는 RELEASE_DEPLOY_KEY 배포 키로 하므로 토큰은 읽기만 합니다.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          # 그사이 master가 움직였을 때 rebase할 기준이 있도록 전체 기록을 받습니다.
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true

      - uses: actions/download-artifact@v7
        with:
          name: "audit-report-${{ github.run_id }}"
          path: ${{ runner.temp }}/audit-report

      - name: Commit TECH_DEBT_AUDIT.md as the next baseline
        run: |
          set -euo pipefail

          cp "$RUNNER_TEMP/audit-report/TECH_DEBT_AUDIT.md" TECH_DEBT_AUDIT.md
          if git ls-files --error-unmatch TECH_DEBT_AUDIT.md >/dev/null 2>&1 \
            && git diff --quiet -- TECH_DEBT_AUDIT.md; then
            echo "TECH_DEBT_AUDIT.md is unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TECH_DEBT_AUDIT.md
          # [skip ci]는 이 보고서만 바꾸는 커밋의 배포 키 push가 워크플로를
          # 시작하지 않게 합니다. 감사의 변경 감지도 *.md를 빼므로 다음 감사를
          # 일으키지 않고, 릴리스 게이트도 *.md를 출하물로 보지 않습니다.
          git commit -m "docs(audit): 기술 부채 감사 기준 결과를 갱신 [skip ci]" \
            -m "월간 감사(실행 ${{ github.run_id }})의 TECH_DEBT_AUDIT.md를 다음 감사의 기준 결과로 커밋합니다."

          for attempt in 1 2 3; do
            git fetch origin master
            if git rebase FETCH_HEAD && git push origin HEAD:master; then
              echo "Committed the baseline as $(git rev-parse HEAD)."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::Baseline push attempt ${attempt} failed; retrying."
            sleep 5
          done
          echo "::error::Could not push TECH_DEBT_AUDIT.md to master after 3 attempts."
          exit 1
