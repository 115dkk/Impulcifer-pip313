[package]
name = "impulcifer-sys-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
impulcifer-types = { path = "../impulcifer-types" }
thiserror.workspace = true


[target.'cfg(windows)'.dependencies]
wasapi = "0.24"
audio_thread_priority = { version = "0.37.0", default-features = false }

[[bench]]
name = "perf"
harness = false
# The bench needs WASAPI and the CABLE-A virtual cable; `cargo test` must not run it
# (it exits 2 without them). The bench code is covered by the bench_smoke test.
test = false
