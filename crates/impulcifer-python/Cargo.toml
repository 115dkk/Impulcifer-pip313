[package]
name = "impulcifer-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "impulcifer_native"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
impulcifer-types = { path = "../impulcifer-types" }
impulcifer-service = { path = "../impulcifer-service" }
impulcifer-cli = { path = "../impulcifer-cli" }
serde_json.workspace = true
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py39"], optional = true }

[features]
default = []
python = ["dep:pyo3"]
