[build-system]
requires = ["maturin>=1.7,<2"]
# maturin with the wheel's RECORD rewritten as CSV (build_backend.py, repair_record.py)
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "impulcifer-py313"
requires-python = ">=3.9"
dynamic = ["version"]
description = "Impulcifer Rust BRIR processing and command-line interface"

[project.scripts]
impulcifer = "impulcifer:cli"

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "impulcifer.impulcifer_native"
include = [
    { path = "python/impulcifer/data/*", format = ["sdist", "wheel"] },
    # The sdist puts pyproject.toml at its root, so the backend must sit there too.
    { path = "build_backend.py", format = "sdist" },
    { path = "repair_record.py", format = "sdist" },
    # impulcifer-service compiles in the 2.x catalogs from <workspace>/i18n/locales;
    # sync_data.py stages them here so they land at the sdist (workspace) root.
    { path = "i18n/locales/*.json", format = "sdist" },
]
