[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "impulcifer-py313"
requires-python = ">=3.9"
dynamic = ["version"]
description = "Impulcifer Rust BRIR processing and command-line interface"

[project.scripts]
impulcifer = "impulcifer:cli"

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "impulcifer.impulcifer_native"
include = [{ path = "python/impulcifer/data/*", format = ["sdist", "wheel"] }]
