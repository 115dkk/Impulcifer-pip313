[package]
name = "impulcifer-audio-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
impulcifer-types = { path = "../impulcifer-types" }
thiserror.workspace = true
cpal = { version = "0.18", optional = true }

[target.'cfg(windows)'.dependencies]
impulcifer-sys-win = { path = "../impulcifer-sys-win", optional = true }

# The same version and features cpal uses on macOS: no new crate in the build,
# only its safe helper for a device's transport type (ADR 0012).
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { version = "0.14.2", default-features = false, features = ["core_audio", "audio_toolbox"], optional = true }

[features]
default = ["native"]
native = ["dep:cpal", "dep:impulcifer-sys-win", "dep:coreaudio-rs"]

[dev-dependencies]
impulcifer-io = { path = "../impulcifer-io" }

[[bench]]
name = "perf"
harness = false
# The bench needs WASAPI and the CABLE-A virtual cable; `cargo test` must not run it
# (it exits 2 without them). The bench code is covered by the bench_smoke test.
test = false
