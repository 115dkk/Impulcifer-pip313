[package]
name = "impulcifer-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
impulcifer-types = { path = "../impulcifer-types" }
impulcifer-jobs = { path = "../impulcifer-jobs" }
impulcifer-dsp = { path = "../impulcifer-dsp" }
impulcifer-plots = { path = "../impulcifer-plots" }
rayon.workspace = true
impulcifer-io = { path = "../impulcifer-io" }
impulcifer-analysis = { path = "../impulcifer-analysis" }
impulcifer-audio-io = { path = "../impulcifer-audio-io" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
sys-locale = "0.3.2"

[target.'cfg(windows)'.dependencies]
# Registry/RtlGetVersion based on Windows; Unix reads procfs / SystemVersion.plist
# directly (os_info spawns uname/sw_vers there, and 3.15 compiles Objective-C).
os_info = { version = "3", default-features = false }

[dev-dependencies]
regex.workspace = true

[[bench]]
name = "perf"
harness = false
test = false

